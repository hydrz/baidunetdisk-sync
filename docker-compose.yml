services:
  baidunetdisk-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: baidunetdisk-sync:latest
    container_name: baidunetdisk-sync
    restart: unless-stopped
    volumes:
      # 挂载本地同步目录到容器内的 /data
      - ${LOCAL_SYNC_DIR:-/home/nan/.baidunetdisk}:/data
      # 挂载 .env 文件以便更新 Token 时持久化保存
      - ./.env:/app/.env
    environment:
      - LOCAL_SYNC_DIR=/data
      - REMOTE_ROOT=${REMOTE_ROOT:-/_pcs_.workspace}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - CONCURRENCY=${CONCURRENCY:-4}
      - BAIDU_ACCESS_TOKEN=${BAIDU_ACCESS_TOKEN}
      - BAIDU_REFRESH_TOKEN=${BAIDU_REFRESH_TOKEN}
      - TZ=Asia/Shanghai
